<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-35: Loading Spinner</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #0f172a; color: #e2e8f0; text-align: center; }
        nav a { margin-right: 15px; color: #38bdf8; text-decoration: none; }
        h1 { color: #38bdf8; }
        .desc { background: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 40px; border-left: 4px solid #38bdf8; text-align: left; }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .dots span {
            display: inline-block; width: 12px; height: 12px; background: #38bdf8;
            border-radius: 50%; margin: 0 4px;
            animation: bounce 1.4s ease-in-out infinite;
        }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </nav>
    <h1>CSS-35: Loading Spinner</h1>
    <div class="desc">Pure CSS loading animations – spinner and bouncing dots.</div>
    <div class="spinner"></div>
    <p>Loading…</p>
    <div class="dots" style="margin-top:30px;">
        <span></span><span></span><span></span>
    </div>
</body>
</html>
