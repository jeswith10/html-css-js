<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-36: Flexbox Layout</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8fafc; }
        nav { padding: 15px 20px; background: #1e40af; }
        nav a { color: white; margin-right: 15px; text-decoration: none; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        h1 { color: #1e40af; }
        .desc { background: #e0f2fe; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #0284c7; }
        .flex { display: flex; flex-wrap: wrap; gap: 15px; }
        .item { flex: 1 1 200px; background: #3b82f6; color: white; padding: 30px; border-radius: 10px; text-align: center; }
        .row { display: flex; justify-content: space-between; align-items: center; background: #e0e7ff; padding: 15px; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </nav>
    <div class="container">
        <h1>CSS-36: Responsive Flexbox</h1>
        <div class="desc">Flexible boxes that wrap on smaller screens.</div>
        <div class="flex">
            <div class="item">Item 1</div>
            <div class="item">Item 2</div>
            <div class="item">Item 3</div>
        </div>
        <div class="row">
            <span>Left</span>
            <span>Center</span>
            <span>Right</span>
        </div>
    </div>
</body>
</html>
