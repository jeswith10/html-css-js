<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-31: Transitions</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f8fafc; }
        nav a { margin-right: 15px; color: #2563eb; text-decoration: none; }
        h1 { color: #1e40af; }
        .desc { background: #e0f2fe; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #0284c7; }
        .box {
            width: 150px; height: 100px; background: #3b82f6; color: white;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px; margin: 20px 0;
            transition: all 0.4s ease;
            cursor: pointer;
        }
        .box:hover {
            background: #8b5cf6;
            transform: scale(1.15);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
        }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </nav>
    <h1>CSS-31: CSS Transitions</h1>
    <div class="desc">Hover the box to see smooth color, size and shadow transitions.</div>
    <div class="box">Hover me</div>
</body>
</html>
