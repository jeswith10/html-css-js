<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-37: CSS Grid</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8fafc; }
        nav { padding: 15px 20px; background: #1e40af; }
        nav a { color: white; margin-right: 15px; text-decoration: none; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        h1 { color: #1e40af; }
        .desc { background: #e0f2fe; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #0284c7; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }
        .cell { background: #8b5cf6; color: white; padding: 40px 20px; border-radius: 10px; text-align: center; font-weight: bold; }
        .span2 { grid-column: span 2; background: #3b82f6; }
        @media (max-width: 500px) { .span2 { grid-column: span 1; } }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </nav>
    <div class="container">
        <h1>CSS-37: Responsive CSS Grid</h1>
        <div class="desc">Auto-fit columns with minmax. Resize to see responsiveness.</div>
        <div class="grid">
            <div class="cell span2">Span 2</div>
            <div class="cell">1</div>
            <div class="cell">2</div>
            <div class="cell">3</div>
            <div class="cell">4</div>
            <div class="cell">5</div>
        </div>
    </div>
</body>
</html>
