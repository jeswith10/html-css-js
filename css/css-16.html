<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-16: Border Radius</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f8fafc; }
        nav a { margin-right: 15px; color: #2563eb; text-decoration: none; }
        h1 { color: #1e40af; }
        .desc { background: #e0f2fe; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #0284c7; }
        .demo { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .card { width: 150px; height: 100px; background: #3b82f6; color: white; display: flex; align-items: center; justify-content: center; }
        .rounded { border-radius: 12px; }
        .circle { width: 100px; height: 100px; border-radius: 50%; }
        .pill { width: 160px; height: 50px; border-radius: 25px; }
        .custom { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </nav>
    <h1>CSS-16: Border Radius</h1>
    <div class="desc">Rounded cards, circles, pills, custom shapes.</div>
    <div class="demo">
        <div class="card rounded">Card</div>
        <div class="card circle">Circle</div>
        <div class="card pill">Pill</div>
        <div class="card custom">Custom</div>
    </div>
</body>
</html>
