<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS-02: Selectors</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;max-width:800px;margin:40px auto;padding:20px;background:#f8fafc}
nav a{margin-right:15px;color:#2563eb;text-decoration:none}
h1{color:#1e40af}
p{line-height:1.6}
.highlight{background:#fef08a;padding:2px 6px}
#unique{color:#be185d;font-weight:bold}
input[type="text"]{border:2px solid #3b82f6;padding:8px}
h2,h3{color:#7c3aed}
.desc{background:#e0f2fe;padding:12px;border-radius:8px;margin-bottom:20px;border-left:4px solid #0284c7}
.box{margin:12px 0;padding:10px;background:white;border-radius:6px;border:1px solid #e2e8f0}
</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></nav>
<h1>CSS-02: Selectors</h1>
<div class="desc">Universal, Element, Class, ID, Attribute, Grouping selectors.</div>
<div class="box">
<p>Element selector: all &lt;p&gt; tags</p>
<p class="highlight">Class selector: .highlight</p>
<p id="unique">ID selector: #unique</p>
<p>Attribute selector: <input type="text" placeholder="type=text"></p>
<h2>Grouping</h2>
<h3>Both h2 and h3 share color</h3>
</div>
</body>
</html>
