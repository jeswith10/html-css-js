<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS-13: Display Properties</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px;background:#f8fafc}
nav a{margin-right:15px;color:#2563eb;text-decoration:none}
h1{color:#1e40af}h2{color:#4338ca;margin-top:25px}
.desc{background:#e0f2fe;padding:12px;border-radius:8px;margin-bottom:20px;border-left:4px solid #0284c7}
.demo{margin:15px 0;padding:15px;background:white;border:1px solid #e2e8f0;border-radius:8px}
.block{display:block;background:#bfdbfe;padding:8px;margin:4px 0}
.inline{display:inline;background:#bbf7d0;padding:8px}
.inline-block{display:inline-block;background:#fde68a;padding:8px;margin:4px;width:120px}
.flex{display:flex;gap:10px}
.flex>div{background:#c4b5fd;padding:15px;flex:1;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid>div{background:#fda4af;padding:15px;text-align:center}
</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">Back to CSS Programs</a></nav>
<h1>CSS-13: Display Properties</h1>
<div class="desc">block, inline, inline-block, flex, grid, none</div>
<h2>display: block</h2>
<div class="demo"><div class="block">Block 1</div><div class="block">Block 2</div></div>
<h2>display: inline</h2>
<div class="demo"><span class="inline">Inline 1</span> <span class="inline">Inline 2</span></div>
<h2>display: inline-block</h2>
<div class="demo"><div class="inline-block">IB 1</div><div class="inline-block">IB 2</div></div>
<h2>display: flex</h2>
<div class="demo flex"><div>Flex 1</div><div>Flex 2</div><div>Flex 3</div></div>
<h2>display: grid</h2>
<div class="demo grid"><div>Grid 1</div><div>Grid 2</div><div>Grid 3</div></div>
</body>
</html>
