<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-06: Audio & Video</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f8fafc; color: #1e293b; }
        nav { margin-bottom: 30px; }
        nav a { margin-right: 15px; color: #2563eb; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        h1 { color: #1e40af; border-bottom: 3px solid #3b82f6; padding-bottom: 10px; }
        h2 { color: #1e40af; margin-top: 30px; }
        .desc { background: #e0f2fe; padding: 12px 16px; border-radius: 8px; margin-bottom: 25px; border-left: 4px solid #0284c7; }
        video, audio { width: 100%; max-width: 500px; margin: 15px 0; display: block; }
        .note { background: #fef3c7; padding: 12px; border-radius: 8px; margin-top: 20px; font-size: 0.95rem; }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to HTML Programs</a>
    </nav>

    <h1>Program 6: Audio & Video Elements</h1>
    <div class="desc">Demonstrates HTML5 &lt;audio&gt; and &lt;video&gt; elements with controls.</div>

    <h2>Video Element</h2>
    <video controls poster="https://picsum.photos/640/360">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <h2>Audio Element</h2>
    <audio controls>
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>

    <div class="note">
        <strong>Note:</strong> Sample media from W3Schools is used for demonstration. In a real project you would host your own audio/video files.
    </div>
</body>
</html>
