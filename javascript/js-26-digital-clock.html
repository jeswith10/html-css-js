<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0}
nav{position:absolute;top:20px;left:20px}nav a{color:#38bdf8;margin-right:15px;text-decoration:none}
.clock{font-size:4rem;font-weight:700;letter-spacing:4px;background:linear-gradient(90deg,#38bdf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.date{color:#94a3b8;font-size:1.2rem;margin-top:10px}
</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">JS Programs</a></nav>
<div class="clock" id="clock">00:00:00</div>
<div class="date" id="date"></div>
<script>
function update(){
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString('en-US',{hour12:false});
  document.getElementById('date').textContent=now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
setInterval(update,1000);update();
</script>
</body>
</html>
