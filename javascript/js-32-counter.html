<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0}
nav{position:absolute;top:20px;left:20px}nav a{color:#38bdf8;margin-right:15px;text-decoration:none}
#count{font-size:5rem;font-weight:700;margin:20px 0}
button{padding:14px 30px;margin:0 10px;font-size:1.2rem;border:none;border-radius:8px;cursor:pointer;color:white}
.inc{background:#22c55e}.dec{background:#ef4444}.res{background:#64748b}
</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">JS Programs</a></nav>
<div id="count">0</div>
<div>
<button class="dec" onclick="change(-1)">−</button>
<button class="res" onclick="change(0)">Reset</button>
<button class="inc" onclick="change(1)">+</button>
</div>
<script>
let c=0;
function change(v){if(v===0)c=0;else c+=v;document.getElementById('count').textContent=c;}
</script>
</body>
</html>
