<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game</title>
<style>
body{font-family:Arial,sans-serif;max-width:450px;margin:40px auto;padding:20px;background:#f8fafc;text-align:center}
nav a{margin-right:15px;color:#2563eb;text-decoration:none}
h1{color:#1e40af}
input{padding:10px;font-size:1.1rem;width:100px}
button{padding:10px 20px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;margin:10px}
#msg{margin-top:20px;font-size:1.2rem}
</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">JS Programs</a></nav>
<h1>Guess the Number (1-100)</h1>
<input type="number" id="guess" min="1" max="100">
<br>
<button onclick="check()">Guess</button>
<button onclick="reset()">New Game</button>
<div id="msg"></div>
<script>
let secret=Math.floor(Math.random()*100)+1, attempts=0;
function check(){
  const g=+document.getElementById('guess').value;
  attempts++;
  if(g===secret) document.getElementById('msg').textContent=`Correct! You took ${attempts} attempts.`;
  else if(g<secret) document.getElementById('msg').textContent='Too low!';
  else document.getElementById('msg').textContent='Too high!';
}
function reset(){secret=Math.floor(Math.random()*100)+1;attempts=0;document.getElementById('msg').textContent='';document.getElementById('guess').value='';}
</script>
</body>
</html>
