<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS-02: Arithmetic</title>
<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:20px;background:#f8fafc}
nav a{margin-right:15px;color:#2563eb;text-decoration:none}
h1{color:#1e40af}
.desc{background:#e0f2fe;padding:12px;border-radius:8px;margin-bottom:20px;border-left:4px solid #0284c7}
input{padding:8px;margin:5px;width:100px}
button{padding:10px 18px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;margin:5px}
#result{margin-top:20px;padding:15px;background:white;border-radius:8px;font-size:1.1rem}
</style>
</head>
<body>
<nav>
<a href="../index.html">Home</a>
<a href="index.html">Back to JS Programs</a>
</nav>
<h1>JS-02: Arithmetic Operations</h1>
<div class="desc">Perform addition, subtraction, multiplication and division.</div>
<input type="number" id="num1" placeholder="Number 1" value="10">
<input type="number" id="num2" placeholder="Number 2" value="5">
<br>
<button onclick="calc('+')">Add</button>
<button onclick="calc('-')">Subtract</button>
<button onclick="calc('*')">Multiply</button>
<button onclick="calc('/')">Divide</button>
<div id="result"></div>
<script>
function calc(op) {
    const a = parseFloat(document.getElementById('num1').value);
    const b = parseFloat(document.getElementById('num2').value);
    let res;
    switch(op) {
        case '+': res = a + b; break;
        case '-': res = a - b; break;
        case '*': res = a * b; break;
        case '/': res = b !== 0 ? a / b : 'Cannot divide by zero'; break;
    }
    document.getElementById('result').textContent = `Result: ${res}`;
}
</script>
</body>
</html>
