body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:20px;background:#f8fafc}

<h1>JS-01: Hello World</h1>
<div class="desc">Display “Hello World” using JavaScript.</div>
<div id="output"></div>
<button onclick="showHello()">Click to Display</button>
<script>
function showHello() {
    document.getElementById('output').textContent = 'Hello World';
}
// Also log to console
console.log('Hello World');
</script>
