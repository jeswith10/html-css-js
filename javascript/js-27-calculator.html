<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0f172a;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 20px}
nav a{color:#38bdf8;margin-right:15px;text-decoration:none}
h1{color:#e2e8f0;margin:20px 0}
.calc{background:#1e293b;border-radius:16px;padding:20px;width:280px;box-shadow:0 10px 40px rgba(0,0,0,0.4)}
#display{width:100%;height:60px;background:#0f172a;color:#38bdf8;font-size:1.8rem;text-align:right;padding:10px;border:none;border-radius:8px;margin-bottom:15px}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{padding:18px;font-size:1.2rem;border:none;border-radius:8px;cursor:pointer;background:#334155;color:#e2e8f0;transition:0.2s}
button:hover{background:#475569}
.op{background:#3b82f6;color:white}
.eq{background:#8b5cf6;color:white;grid-column:span 2}
.clear{background:#ef4444;color:white}
</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">JS Programs</a></nav>
<h1>Digital Calculator</h1>
<div class="calc">
<input id="display" readonly value="0">
<div class="buttons">
<button class="clear" onclick="clearDisplay()">C</button>
<button onclick="append('(')">(</button>
<button onclick="append(')')">)</button>
<button class="op" onclick="append('/')">/</button>
<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button class="op" onclick="append('*')">×</button>
<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button class="op" onclick="append('-')">−</button>
<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button class="op" onclick="append('+')">+</button>
<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button class="eq" onclick="calculate()">=</button>
</div>
</div>
<script>
let display=document.getElementById('display');
function append(v){if(display.value==='0'&&v!=='.')display.value=v;else display.value+=v;}
function clearDisplay(){display.value='0';}
function calculate(){
  try{display.value=eval(display.value.replace(/×/g,'*').replace(/−/g,'-'));}
  catch(e){display.value='Error';}
}
</script>
</body>
</html>
