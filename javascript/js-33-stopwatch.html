<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0}
nav{position:absolute;top:20px;left:20px}nav a{color:#38bdf8;margin-right:15px;text-decoration:none}
#time{font-size:4rem;font-weight:700;letter-spacing:3px;margin-bottom:30px}
.btns button{padding:12px 28px;margin:0 8px;font-size:1rem;border:none;border-radius:8px;cursor:pointer;color:white}
.start{background:#22c55e}.stop{background:#ef4444}.reset{background:#64748b}
</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">JS Programs</a></nav>
<div id="time">00:00:00</div>
<div class="btns">
<button class="start" onclick="start()">Start</button>
<button class="stop" onclick="stop()">Stop</button>
<button class="reset" onclick="reset()">Reset</button>
</div>
<script>
let [h,m,s,ms]=[0,0,0,0], timer=null;
function update(){
  ms++;if(ms===100){ms=0;s++;}if(s===60){s=0;m++;}if(m===60){m=0;h++;}
  document.getElementById('time').textContent=
    String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function start(){if(!timer)timer=setInterval(update,10);}
function stop(){clearInterval(timer);timer=null;}
function reset(){stop();[h,m,s,ms]=[0,0,0,0];document.getElementById('time').textContent='00:00:00';}
</script>
</body>
</html>
