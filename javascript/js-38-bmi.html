<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>
<style>
body{font-family:Arial,sans-serif;max-width:450px;margin:40px auto;padding:20px;background:#f8fafc}
nav a{margin-right:15px;color:#2563eb;text-decoration:none}
h1{color:#1e40af}
label{display:block;margin:12px 0 4px}
input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box}
button{margin-top:20px;padding:12px 28px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;width:100%}
#result{margin-top:20px;padding:15px;background:white;border-radius:8px;text-align:center;font-size:1.2rem}
</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">JS Programs</a></nav>
<h1>BMI Calculator</h1>
<label>Height (cm)</label>
<input type="number" id="h" value="170">
<label>Weight (kg)</label>
<input type="number" id="w" value="65">
<button onclick="calc()">Calculate BMI</button>
<div id="result"></div>
<script>
function calc(){
  const h=+document.getElementById('h').value/100;
  const w=+document.getElementById('w').value;
  const bmi=(w/(h*h)).toFixed(1);
  let cat=bmi<18.5?'Underweight':bmi<25?'Normal':bmi<30?'Overweight':'Obese';
  document.getElementById('result').innerHTML=`BMI: <strong>${bmi}</strong><br>${cat}`;
}
</script>
</body>
</html>
