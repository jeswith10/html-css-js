<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Text</title>
<style>body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:20px;background:#f8fafc}nav a{margin-right:15px;color:#2563eb;text-decoration:none}h1{color:#1e40af}#text{font-size:1.5rem;margin:20px 0;padding:15px;background:white;border-radius:8px}button{padding:10px 18px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;margin:5px}</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">JS Programs</a></nav>
<h1>Change Text using JavaScript</h1>
<div id="text">Original Text</div>
<button onclick="document.getElementById('text').textContent='Text has been changed!'">Change Text</button>
<button onclick="document.getElementById('text').textContent='Original Text'">Reset</button>
</body>
</html>
