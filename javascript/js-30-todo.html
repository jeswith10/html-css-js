<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:30px 20px}
nav a{color:#38bdf8;margin-right:15px;text-decoration:none}
.container{max-width:500px;margin:30px auto}
h1{text-align:center;margin-bottom:25px;background:linear-gradient(90deg,#38bdf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.input-row{display:flex;gap:10px;margin-bottom:20px}
input{flex:1;padding:12px;border:1px solid #334155;border-radius:8px;background:#1e293b;color:#e2e8f0;font-size:1rem}
button{padding:12px 20px;background:#3b82f6;color:white;border:none;border-radius:8px;cursor:pointer}
ul{list-style:none;padding:0}
li{background:#1e293b;padding:14px 16px;margin-bottom:8px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid #334155}
li.done span{text-decoration:line-through;color:#64748b}
li button{background:#ef4444;padding:6px 12px;font-size:0.85rem}
</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">JS Programs</a></nav>
<div class="container">
<h1>To-Do List</h1>
<div class="input-row">
<input type="text" id="taskInput" placeholder="Add a new task...">
<button onclick="addTask()">Add</button>
</div>
<ul id="taskList"></ul>
</div>
<script>
const list=document.getElementById('taskList');
const input=document.getElementById('taskInput');
function addTask(){
  const text=input.value.trim();
  if(!text)return;
  const li=document.createElement('li');
  li.innerHTML=`<span onclick="this.parentElement.classList.toggle('done')">${text}</span>
  <button onclick="this.parentElement.remove()">Delete</button>`;
  list.appendChild(li);
  input.value='';
}
input.addEventListener('keypress',e=>{if(e.key==='Enter')addTask();});
</script>
</body>
</html>
