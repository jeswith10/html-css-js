<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:20px;background:#f8fafc}
nav a{margin-right:15px;color:#2563eb;text-decoration:none}

<body>
<nav>
<a href="../index.html">Home</a>

<h1>JS-03: Largest of Three Numbers</h1>
<div class="desc">Find the largest among three numbers.</div>
<input type="number" id="a" value="15">
<input type="number" id="b" value="42">
<input type="number" id="c" value="27">
<br><br>
<button onclick="findLargest()">Find Largest</button>
<div id="result"></div>
<script>
function findLargest() {
    const a = +document.getElementById('a').value;
    const b = +document.getElementById('b').value;
    const c = +document.getElementById('c').value;
    const largest = Math.max(a, b, c);
    document.getElementById('result').textContent = `Largest number is: ${largest}`;
}
</script>
</body>
