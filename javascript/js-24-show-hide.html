<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Show / Hide</title>
<style>body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:20px;background:#f8fafc}nav a{margin-right:15px;color:#2563eb;text-decoration:none}h1{color:#1e40af}#box{padding:30px;background:#dbeafe;border-radius:10px;margin:20px 0;text-align:center;font-size:1.2rem}button{padding:10px 18px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;margin:5px}</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">JS Programs</a></nav>
<h1>Show / Hide Element</h1>
<div id="box">I am visible!</div>
<button onclick="document.getElementById('box').style.display='none'">Hide</button>
<button onclick="document.getElementById('box').style.display='block'">Show</button>
<button onclick="document.getElementById('box').style.display=document.getElementById('box').style.display==='none'?'block':'none'">Toggle</button>
</body>
</html>
