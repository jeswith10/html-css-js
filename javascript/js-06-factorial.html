<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS-06: Factorial</title>
<style>body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:20px;background:#f8fafc}nav a{margin-right:15px;color:#2563eb;text-decoration:none}h1{color:#1e40af}.desc{background:#e0f2fe;padding:12px;border-radius:8px;margin-bottom:20px;border-left:4px solid #0284c7}input{padding:8px}button{padding:10px 18px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;margin-left:8px}#result{margin-top:15px;font-size:1.2rem;color:#059669}</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">Back to JS Programs</a></nav>
<h1>JS-06: Factorial</h1>
<div class="desc">Calculate factorial of a number.</div>
<input type="number" id="num" value="5" min="0">
<button onclick="fact()">Calculate</button>
<div id="result"></div>
<script>
function fact(){
  let n=+document.getElementById('num').value, f=1;
  if(n<0){document.getElementById('result').textContent='Invalid';return;}
  for(let i=2;i<=n;i++) f*=i;
  document.getElementById('result').textContent = n+'! = '+f;
}
</script>
</body>
