<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<style>
body{font-family:Arial,sans-serif;max-width:450px;margin:40px auto;padding:20px;background:#0f172a;color:#e2e8f0}
nav a{color:#38bdf8;margin-right:15px;text-decoration:none}
h1{color:#38bdf8}
input[type=range]{width:100%}
#pwd{font-size:1.3rem;letter-spacing:2px;background:#1e293b;padding:15px;border-radius:8px;margin:20px 0;word-break:break-all;text-align:center}
button{padding:12px 24px;background:#3b82f6;color:white;border:none;border-radius:8px;cursor:pointer;width:100%;font-size:1rem}
</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">JS Programs</a></nav>
<h1>Password Generator</h1>
<label>Length: <span id="lenVal">12</span></label>
<input type="range" id="len" min="6" max="32" value="12" oninput="document.getElementById('lenVal').textContent=this.value">
<div id="pwd">Click Generate</div>
<button onclick="gen()">Generate Password</button>
<script>
function gen(){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
  const len=+document.getElementById('len').value;
  let p='';
  for(let i=0;i<len;i++) p+=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('pwd').textContent=p;
}
</script>
</body>
</html>
