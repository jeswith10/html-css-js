<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Switcher</title>
<style>
:root{--bg:#f8fafc;--text:#1e293b;--card:#ffffff;--accent:#3b82f6}
[data-theme="dark"]{--bg:#0f172a;--text:#e2e8f0;--card:#1e293b;--accent:#38bdf8}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;margin:0;padding:30px 20px;transition:0.3s}
nav a{color:var(--accent);margin-right:15px;text-decoration:none}
.card{max-width:500px;margin:30px auto;background:var(--card);padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
button{padding:12px 24px;background:var(--accent);color:white;border:none;border-radius:8px;cursor:pointer;font-size:1rem}
</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">JS Programs</a></nav>
<div class="card">
<h1>Dark / Light Theme</h1>
<p>Preference is saved in localStorage and persists after refresh.</p>
<button onclick="toggle()">Toggle Theme</button>
</div>
<script>
const body=document.body;
const saved=localStorage.getItem('theme')||'light';
body.setAttribute('data-theme',saved);
function toggle(){
  const next=body.getAttribute('data-theme')==='dark'?'light':'dark';
  body.setAttribute('data-theme',next);
  localStorage.setItem('theme',next);
}
</script>
</body>
</html>
