<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Color</title>
<style>body{font-family:Arial,sans-serif;min-height:100vh;margin:0;padding:40px 20px;transition:background 0.3s}nav a{margin-right:15px;color:#2563eb;text-decoration:none}h1{color:#1e40af}button{padding:12px 20px;margin:8px;border:none;border-radius:6px;cursor:pointer;color:white;font-size:1rem}</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">JS Programs</a></nav>
<h1>Change Background Color</h1>
<button style="background:#ef4444" onclick="document.body.style.background='#fecaca'">Red</button>
<button style="background:#22c55e" onclick="document.body.style.background='#bbf7d0'">Green</button>
<button style="background:#3b82f6" onclick="document.body.style.background='#bfdbfe'">Blue</button>
<button style="background:#8b5cf6" onclick="document.body.style.background='#e9d5ff'">Purple</button>
<button style="background:#64748b" onclick="document.body.style.background='#f8fafc'">Reset</button>
</body>
</html>
