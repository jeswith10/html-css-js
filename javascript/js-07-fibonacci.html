<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS-07: Fibonacci</title>
<style>body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:20px;background:#f8fafc}nav a{margin-right:15px;color:#2563eb;text-decoration:none}h1{color:#1e40af}.desc{background:#e0f2fe;padding:12px;border-radius:8px;margin-bottom:20px;border-left:4px solid #0284c7}input{padding:8px}button{padding:10px 18px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;margin-left:8px}#result{margin-top:15px;padding:12px;background:white;border-radius:8px;word-break:break-all}</style>
</head>
<body>
<nav><a href="../index.html">Home</a><a href="index.html">Back to JS Programs</a></nav>
<h1>JS-07: Fibonacci Series</h1>
<div class="desc">Generate Fibonacci series up to n terms.</div>
<input type="number" id="num" value="10" min="1">
<button onclick="fib()">Generate</button>
<div id="result"></div>
<script>
function fib(){
  let n=+document.getElementById('num').value;
  if(n<1){document.getElementById('result').textContent='Enter positive number';return;}
  let a=0,b=1,s=[0];
  for(let i=1;i<n;i++){s.push(b);[a,b]=[b,a+b];}
  document.getElementById('result').textContent = s.join(', ');
}
</script>
</body>
</html>
